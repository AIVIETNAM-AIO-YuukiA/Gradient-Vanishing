[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "gradient-vanishing-research"
version = "0.1.0"
description = "First-element memorization experiments from the Gradient Vanishing notebook"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch==2.11.0",
  "numpy==2.4.0",
  "pandas==2.3.3",
  "matplotlib==3.10.8",
  "seaborn==0.13.2",
  "optuna==4.8.0",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
gradient-vanishing = "gradient_vanishing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gradient_vanishing = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
